<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">BOUNCAMPUS campus context atlas</title>
  <desc id="desc">Stylized decorative strip representing multiple Boğaziçi campus contexts connected through one climate operations layer.</desc>
  <defs>
    <linearGradient id="terrain" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#16362f"/>
      <stop offset=".5" stop-color="#17485a"/>
      <stop offset="1" stop-color="#16362f"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#b8e467" stop-opacity=".15"/>
      <stop offset=".5" stop-color="#b8e467"/>
      <stop offset="1" stop-color="#dff2f5" stop-opacity=".18"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="220" rx="28" fill="#061727"/>
  <path d="M0 156C98 112 177 118 263 145c85 27 171 26 256-9 98-41 191-42 282-4 83 35 172 33 266-8 47-20 91-25 133-15v111H0Z" fill="url(#terrain)" opacity=".9"/>
  <path d="M0 178c126-38 245-41 357-9 115 33 236 30 364-10 99-31 199-30 300 4 66 22 126 24 179 8" fill="none" stroke="#dff2f5" stroke-opacity=".12" stroke-width="2"/>
  <path d="M54 116C180 72 302 74 420 111c124 39 251 38 382-6 108-36 222-32 344 14" fill="none" stroke="url(#trace)" stroke-width="2.5" stroke-dasharray="8 10"/>
  <g fill="#123f68" stroke="#dff2f5" stroke-opacity=".16" stroke-width="1.5">
    <g transform="translate(92 80)"><path d="M0 48h98v42H0z"/><path d="M-8 48h114L83 22H16Z"/></g>
    <g transform="translate(270 68)"><path d="M0 60h116v50H0z"/><path d="M-10 60h136L97 28H22Z"/></g>
    <g transform="translate(485 82)"><path d="M0 46h94v40H0z"/><path d="M-7 46h108L80 21H14Z"/></g>
    <g transform="translate(670 70)"><path d="M0 58h108v46H0z"/><path d="M-8 58h124L91 29H18Z"/></g>
    <g transform="translate(876 84)"><path d="M0 44h88v38H0z"/><path d="M-7 44h102L74 20H15Z"/></g>
    <g transform="translate(1030 74)"><path d="M0 54h92v44H0z"/><path d="M-7 54h106L78 26H16Z"/></g>
  </g>
  <g fill="#b8e467" filter="url(#glow)">
    <circle cx="141" cy="115" r="5"/><circle cx="328" cy="102" r="5"/><circle cx="532" cy="112" r="5"/><circle cx="724" cy="105" r="5"/><circle cx="919" cy="114" r="5"/><circle cx="1076" cy="108" r="5"/>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="9" font-weight="800" letter-spacing="1.2" fill="#dff2f5" fill-opacity=".55" text-anchor="middle">
    <text x="141" y="190">SOUTH</text><text x="328" y="190">NORTH</text><text x="532" y="190">HİSAR</text><text x="724" y="190">UÇAKSAVAR</text><text x="919" y="190">KANDİLLİ</text><text x="1076" y="190">KİLYOS</text>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="1.8">
    <text x="34" y="32" fill="#b8e467">CAMPUS CONTEXT ATLAS</text>
    <text x="34" y="52" fill="#dff2f5" fill-opacity=".42" font-size="8" letter-spacing="1.2">ONE CLIMATE OPERATIONS LAYER · MULTIPLE CAMPUS CONTEXTS</text>
