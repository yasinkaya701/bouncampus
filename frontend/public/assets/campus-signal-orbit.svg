<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Campus signal orbit</title>
  <desc id="desc">Decorative operational signal field with campus nodes, orbit lines and a human approval hub.</desc>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b8e467" stop-opacity=".18"/>
      <stop offset=".42" stop-color="#66c7d7" stop-opacity=".08"/>
      <stop offset="1" stop-color="#66c7d7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#dff2f5" stop-opacity=".08"/>
      <stop offset=".45" stop-color="#b8e467" stop-opacity=".72"/>
      <stop offset="1" stop-color="#dff2f5" stop-opacity=".08"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="360" cy="360" r="318" fill="url(#halo)"/>
  <g fill="none" stroke="url(#orbit)">
    <circle cx="360" cy="360" r="276" stroke-width="1.5"/>
    <circle cx="360" cy="360" r="212" stroke-width="1.2" stroke-dasharray="7 10"/>
    <circle cx="360" cy="360" r="148" stroke-width="1" stroke-dasharray="3 8"/>
    <ellipse cx="360" cy="360" rx="306" ry="150" transform="rotate(-18 360 360)" stroke-width="1" stroke-opacity=".45"/>
    <ellipse cx="360" cy="360" rx="304" ry="124" transform="rotate(42 360 360)" stroke-width="1" stroke-opacity=".35"/>
  </g>
  <g stroke="#dff2f5" stroke-opacity=".07" stroke-width="1">
    <path d="M360 46v628M46 360h628M138 138l444 444M582 138 138 582"/>
  </g>
  <g filter="url(#softGlow)">
    <circle cx="360" cy="360" r="13" fill="#b8e467"/>
    <circle cx="360" cy="360" r="25" fill="none" stroke="#b8e467" stroke-opacity=".35"/>
    <circle cx="182" cy="190" r="8" fill="#dff2f5"/>
    <circle cx="546" cy="206" r="8" fill="#b8e467"/>
    <circle cx="602" cy="410" r="7" fill="#dff2f5"/>
    <circle cx="480" cy="570" r="8" fill="#b8e467"/>
    <circle cx="208" cy="548" r="7" fill="#dff2f5"/>
    <circle cx="104" cy="354" r="8" fill="#b8e467"/>
  </g>
  <g fill="none" stroke="#b8e467" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 8" stroke-opacity=".55">
    <path d="M182 190 360 360 546 206"/>
    <path d="M104 354 360 360 602 410"/>
    <path d="M208 548 360 360 480 570"/>
  </g>
  <g transform="translate(305 305)">
    <rect width="110" height="110" rx="30" fill="#071c33" fill-opacity=".82" stroke="#fff" stroke-opacity=".12"/>
    <path d="M28 71V45l27-18 27 18v26M39 71V50h32v21" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M21 81h68" stroke="#b8e467" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="1.4" fill="#dff2f5" fill-opacity=".56">
    <text x="142" y="173">SCHEDULE</text>
    <text x="522" y="189">WEATHER</text>
    <text x="581" y="396">BUILDING</text>
    <text x="462" y="603">PILOT</text>
    <text x="168" y="579">LEARN</text>
    <text x="70" y="340">EVIDENCE</text>
  </g>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <text x="360" y="440" fill="#b8e467" font-size="11" font-weight="800" letter-spacing="2">HUMAN APPROVAL HUB</text>
    <text x="360" y="459" fill="#dff2f5" fill-opacity=".46" font-size="9" font-weight="600">signal → decision → measurable pilot</text>
  </g>
</svg>
