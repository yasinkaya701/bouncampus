  <g fill="#225447"><circle cx="134" cy="644" r="67"/><circle cx="470" cy="655" r="52"/><circle cx="871" cy="665" r="58"/><circle cx="1185" cy="694" r="78"/><circle cx="1360" cy="739" r="60"/></g>
  <g fill="none" stroke="#b8e467" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 12" opacity=".75">
    <path d="M345 480 618 361 996 481"/><path d="M618 361 812 241"/><path d="M618 361 1098 282"/>
  </g>
  <g filter="url(#glow)"><circle cx="345" cy="480" r="9" fill="#b8e467"/><circle cx="618" cy="361" r="11" fill="#b8e467"/><circle cx="996" cy="481" r="9" fill="#b8e467"/><circle cx="812" cy="241" r="8" fill="#dff2f5"/><circle cx="1098" cy="282" r="8" fill="#dff2f5"/></g>
  <g transform="translate(92 88)">
