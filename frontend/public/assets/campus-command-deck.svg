<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">BOUNCAMPUS command deck</title>
  <desc id="desc">Original vector scene of a Bosphorus-side campus digital twin with buildings, climate signals, decision nodes and operational overlays.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071c33"/><stop offset="1" stop-color="#0a2b44"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#133d59"/><stop offset="1" stop-color="#071f34"/></linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16362f"/><stop offset="1" stop-color="#0b2422"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity=".035"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0v48" fill="none" stroke="#dff2f5" stroke-opacity=".035"/></pattern>
  </defs>
