    <text x="28" y="112" fill="#dff2f5" fill-opacity=".65" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600">Schedules + weather + building context</text>
    <rect x="28" y="136" width="130" height="4" rx="2" fill="#b8e467"/><rect x="168" y="136" width="78" height="4" rx="2" fill="#dff2f5" fill-opacity=".25"/>
  </g>
  <g transform="translate(1146 130)">
    <rect width="342" height="178" rx="24" fill="#061727" fill-opacity=".9" stroke="#fff" stroke-opacity=".12"/>
    <text x="24" y="34" fill="#dff2f5" fill-opacity=".7" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">DECISION WINDOW</text>
    <text x="24" y="78" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="35" font-weight="800">14:20–16:10</text>
    <text x="24" y="106" fill="#b8e467" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">LOW-USE CANDIDATE</text>
    <path d="M24 135h294" stroke="#fff" stroke-opacity=".1"/>
    <text x="24" y="158" fill="#dff2f5" fill-opacity=".56" font-family="Inter,Arial,sans-serif" font-size="12">human review required before pilot</text>
  </g>
  <g transform="translate(1048 600)">
    <rect width="438" height="186" rx="24" fill="#061727" fill-opacity=".92" stroke="#fff" stroke-opacity=".12"/>
    <text x="24" y="36" fill="#b8e467" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.4">EVIDENCE BOUNDARY</text>
    <text x="24" y="72" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800">Model ≠ live telemetry</text>
    <text x="24" y="105" fill="#dff2f5" fill-opacity=".58" font-family="Inter,Arial,sans-serif" font-size="13">occupancy / energy / CO₂ are estimates</text>
    <g transform="translate(24 132)"><rect width="112" height="30" rx="15" fill="#b8e467" fill-opacity=".14" stroke="#b8e467" stroke-opacity=".28"/><text x="18" y="20" fill="#b8e467" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800">SOURCE-BACKED</text></g>
  </g>
  <g transform="translate(705 702)">
    <rect width="276" height="92" rx="20" fill="#061727" fill-opacity=".86" stroke="#fff" stroke-opacity=".1"/>
    <circle cx="32" cy="46" r="8" fill="#b8e467"/><text x="56" y="39" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800">Sense → Decide → Pilot</text><text x="56" y="61" fill="#dff2f5" fill-opacity=".52" font-family="Inter,Arial,sans-serif" font-size="11">closed learning loop</text>
  </g>
