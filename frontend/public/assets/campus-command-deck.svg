  <g opacity=".3" fill="none" stroke="#dff2f5" stroke-width="2"><path d="M1122 122c142 30 263 21 362-27"/><path d="M1081 212c169 36 310 29 425-22"/><path d="M1050 305c188 40 350 30 485-30"/><path d="M1030 399c203 42 374 31 514-31"/></g>
  <path d="M0 638c222-121 466-162 732-123 182 27 345 11 489-48 102-42 197-44 285-8 29 12 60 21 94 28v413H0Z" fill="url(#land)"/>
  <path d="M0 720c211-72 430-83 657-34 173 37 343 26 510-34 140-50 284-53 433-9v257H0Z" fill="#0c2a27" opacity=".86"/>
