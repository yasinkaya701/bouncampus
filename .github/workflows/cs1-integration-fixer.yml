name: CS1 Integration Fixer

on:
  push:
    branches:
      - role/cs1-decision-intelligence

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ci(cs1): run integration fixer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: role/cs1-decision-intelligence
          fetch-depth: 0

      - name: Apply deterministic integration fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          food_lib = Path('frontend/src/lib/food-waste.ts')
          text = food_lib.read_text(encoding='utf-8')
          old_type = '  recommendedTarget: number | null;'
          old_value = '    recommendedTarget: abstained ? null : demand,'
          if old_type not in text or old_value not in text:
              raise SystemExit('food-waste diagnostic target anchors changed')
          text = text.replace(old_type, '  recommendedTarget: number;', 1)
          text = text.replace(old_value, '    recommendedTarget: demand,', 1)
          food_lib.write_text(text, encoding='utf-8')

          page = Path('frontend/src/app/food-waste/page.tsx')
          text = page.read_text(encoding='utf-8')
          anchor = "                      <div className=\"text-[8px] font-medium text-[#778079]\">{band?.provenance ?? 'MODEL_ESTIMATE'}</div>\n"
          disclosure = (
              anchor
              + "                      <div className=\"mt-1 text-[7px] font-semibold tracking-[0.04em] text-[#667068]\">"
              + "MODEL_ESTIMATE · POLICY_HEURISTIC · PLANNING_RANGE_NOT_CALIBRATED_INTERVAL · NOT_CALIBRATED"
              + "</div>\n"
          )
          if anchor not in text:
              raise SystemExit('food page provenance anchor changed')
          text = text.replace(anchor, disclosure, 1)
          page.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/ci-hosted-fallback.yml')
          text = workflow.read_text(encoding='utf-8')
          anchor = '      - run: npm ci --no-audit --no-fund\n      - run: npm run typecheck\n'
          targeted = '''      - run: npm ci --no-audit --no-fund
      - name: Run CS1 frontend decision regressions when present
        run: |
          set -euo pipefail
          if [ -f scripts/campus-operations.test.mjs ]; then npm run test:campus-operations; fi
          if [ -f scripts/shuttle-frequency.test.mjs ]; then node --experimental-strip-types scripts/shuttle-frequency.test.mjs; fi
          if [ -f scripts/shuttle-navigation.test.mjs ]; then node --experimental-strip-types scripts/shuttle-navigation.test.mjs; fi
          if [ -f scripts/food-diagnostic-eligibility.test.mjs ]; then node --experimental-strip-types scripts/food-diagnostic-eligibility.test.mjs; fi
      - run: npm run typecheck
'''
          if anchor not in text:
              raise SystemExit('hosted frontend gate anchor changed')
          text = text.replace(anchor, targeted, 1)
          workflow.write_text(text, encoding='utf-8')
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/food-waste.ts frontend/src/app/food-waste/page.tsx .github/workflows/ci-hosted-fallback.yml
          git diff --cached --check
          git commit -m "fix(cs1): resolve master integration contracts"
          git push origin HEAD:role/cs1-decision-intelligence
