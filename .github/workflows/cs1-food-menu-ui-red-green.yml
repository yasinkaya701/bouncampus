name: CS1 Food Menu UI Red Green

on:
  push:
    branches:
      - agent/cs1/campus-ops-suite

permissions:
  contents: read

jobs:
  food-menu-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Run menu-driven food product regression
        run: node --experimental-strip-types scripts/food-menu-demand.test.mjs
