name: EHB Regression Gate

on:
  pull_request:
    paths:
      - 'backend/app/edge/**'
      - 'scripts/test_ehb_*.py'
      - '.github/workflows/ehb-regression.yml'
  push:
    branches:
      - master
      - 'role/ehb-embedded-integration'
    paths:
      - 'backend/app/edge/**'
      - 'scripts/test_ehb_*.py'
      - '.github/workflows/ehb-regression.yml'

permissions:
  contents: read

jobs:
  ehb-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile EHB runtime and regression scripts
        run: python -m compileall -q backend/app/edge scripts/test_ehb_*.py
      - name: Execute EHB regressions
        shell: bash
        run: |
          set -euo pipefail
          for test_file in scripts/test_ehb_*.py; do
            python "$test_file"
          done
