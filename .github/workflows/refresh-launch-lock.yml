name: Refresh launch lockfile

on:
  push:
    branches: [fix/launch-typescript-gate]
    paths:
      - '.github/workflows/refresh-launch-lock.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: [self-hosted, macOS, ARM64, bouncampus]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/launch-typescript-gate
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Refresh npm lockfile only
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          git commit -m 'chore(deps): refresh Node 24 launch lockfile'
          git push origin HEAD:fix/launch-typescript-gate
