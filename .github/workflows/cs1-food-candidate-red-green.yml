name: CS1 Current Head Verify

on:
  push:
    branches:
      - agent/cs1/campus-ops-suite

permissions:
  contents: read

jobs:
  backend-all-cs1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend and scripts
        run: python -m compileall -q backend/app scripts
      - name: Run all CS1 regression scripts
        run: |
          set -euo pipefail
          for test_file in scripts/test_cs1_*.py; do
            echo "==> $test_file"
            python "$test_file"
          done
          python scripts/test_food_decision_policy.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:campus-operations
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate agent fabric
        run: python scripts/agent_fabric_check.py
      - name: Validate KREATE operating system
        run: python scripts/kreate_check.py
      - name: Validate feature preservation
        run: python scripts/verify_feature_preservation.py
