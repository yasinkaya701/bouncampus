name: CS1 Food Candidate Red Green

on:
  push:
    branches:
      - agent/cs1/campus-ops-suite

permissions:
  contents: read

jobs:
  food-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run menu-driven food planning candidate regression
        run: python scripts/test_cs1_food_menu_adjustment.py
