name: CS1 Class Search Limit V2 Verify

on:
  pull_request:
    branches:
      - agent/cs1/campus-ops-suite

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/test_cs1_class_conflict_hardening.py
