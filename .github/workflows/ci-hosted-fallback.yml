name: CI Hosted Fallback

on:
  pull_request:
  push:
    branches:
      - master
      - 'role/**'
      - 'agent/quality-release/**'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-hosted-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  merge-discipline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate PR topology and per-role concurrency
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          role_branches="$(python - <<'PY'
          import json
          cfg = json.load(open('.agents/fabric.json'))
          print('\n'.join(cfg['role_branches'].values()))
          PY
          )"
          feature_limit="$(python - <<'PY'
          import json
          cfg = json.load(open('.agents/fabric.json'))
          print(cfg['integration']['max_open_feature_pull_requests_per_role'])
          PY
          )"

          is_role_branch() {
            printf '%s\n' "$role_branches" | grep -Fxq "$1"
          }

          if [ "$BASE_REF" = "master" ]; then
            if is_role_branch "$HEAD_REF"; then
              :
            elif [[ "$HEAD_REF" == agent/quality-release/* ]]; then
              echo "Governance/bootstrap PR directly to master."
            else
              echo "PRs to master must come from a configured role branch or agent/quality-release/*."
              exit 1
            fi
          elif is_role_branch "$BASE_REF"; then
            if [[ "$HEAD_REF" != agent/* ]]; then
              echo "Feature PRs into role branches must use agent/<lane>/<task> heads."
              exit 1
            fi
            open_count="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base "$BASE_REF" --json number --jq 'length')"
            if [ "$open_count" -gt "$feature_limit" ]; then
              echo "Role branch $BASE_REF exceeds feature PR limit: $open_count > $feature_limit."
              exit 1
            fi
          else
            echo "Unsupported PR base: $BASE_REF. Use a configured role branch or master."
            exit 1
          fi

      - name: Require PR head to contain current target base
        run: |
          git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD || {
            echo "PR head is stale. Integrate the latest target branch before merge."
            exit 1
          }

      - name: Preserve registered features
        run: python scripts/verify_feature_preservation.py --base-ref "${{ github.event.pull_request.base.sha }}"

      - name: Validate autonomous agent fabric
        run: python scripts/agent_fabric_check.py

      - name: Validate merge-before-exit gate
        run: python -m py_compile scripts/agent_exit_gate.py

  master-merge-audit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require merged-PR provenance and normal merge commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git rev-parse HEAD^ >/dev/null 2>&1 || ! git cat-file -e HEAD^:.github/merge-enforcement-v2-enabled 2>/dev/null; then
            echo "Merge policy bootstrap commit; strict provenance starts with the next master change after v2 marker."
            exit 0
          fi

          merged_count="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "master")] | length')"

          if [ "$merged_count" -lt 1 ]; then
            echo "Direct push to master detected. Changes must merge through a validated PR."
            exit 1
          fi

          parent_count="$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')"
          if [ "$parent_count" -lt 2 ]; then
            echo "Master integration is not a normal merge commit."
            exit 1
          fi

      - name: Verify integrated head is contained in master
        run: |
          branch_head="$(git rev-parse HEAD^2)"
          python scripts/agent_exit_gate.py --branch-head "$branch_head" --master-ref HEAD

  feature-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate registered feature files
        run: python scripts/verify_feature_preservation.py
      - name: Validate agent fabric policy
        run: python scripts/agent_fabric_check.py
      - name: Compile merge-before-exit gate
        run: python -m py_compile scripts/agent_exit_gate.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  repository-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile repository Python
        run: python -m compileall -q backend/app scripts
      - name: Test autonomous agent fabric
        run: python scripts/test_agent_fabric_check.py
      - name: Test autonomous task operations
        run: python scripts/test_agent_task.py
      - name: Validate autonomous agent fabric
        run: python scripts/agent_fabric_check.py
      - name: Validate KREATE operating system
        run: python scripts/kreate_check.py
      - name: Validate critical JSON datasets
        run: |
          python -m json.tool backend/app/data/campus_config.json >/dev/null
          python -m json.tool frontend/src/data/campus_config.json >/dev/null
          python -m json.tool frontend/src/data/real_boun_courses.json >/dev/null

  backend-cs1-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app scripts
      - name: Run CS1 regressions when present
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(scripts/test_cs1_*.py)
          for test_file in "${tests[@]}"; do
            echo "==> $test_file"
            python "$test_file"
          done
          if [ -f scripts/test_food_decision_policy.py ]; then
            python scripts/test_food_decision_policy.py
          fi
