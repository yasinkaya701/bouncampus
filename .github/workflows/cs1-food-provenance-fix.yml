name: CS1 Food Provenance Fix

on:
  push:
    branches:
      - agent/cs1/master-sync

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cs1/master-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore explicit provenance disclosure
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/app/food-waste/page.tsx')
          page = path.read_text()
          old = "footer={band ? (advisoryOnly ? t('ADVISORY · mutfak emri değil', 'ADVISORY · not a kitchen order') : t('MODEL_ESTIMATE · ölçüm değil', 'MODEL_ESTIMATE · not measured')) : t('Karar bağlamı bekleniyor', 'Waiting for decision context')}"
          new = "footer={band ? (advisoryOnly ? t('MODEL_ESTIMATE → POLICY_HEURISTIC · NOT_CALIBRATED · PLANNING_RANGE_NOT_CALIBRATED_INTERVAL · mutfak emri değil', 'MODEL_ESTIMATE → POLICY_HEURISTIC · NOT_CALIBRATED · PLANNING_RANGE_NOT_CALIBRATED_INTERVAL · not a kitchen order') : t('MODEL_ESTIMATE → POLICY_HEURISTIC · NOT_CALIBRATED · PLANNING_RANGE_NOT_CALIBRATED_INTERVAL', 'MODEL_ESTIMATE → POLICY_HEURISTIC · NOT_CALIBRATED · PLANNING_RANGE_NOT_CALIBRATED_INTERVAL')) : t('Karar bağlamı bekleniyor', 'Waiting for decision context')}"
          if page.count(old) != 1:
              raise SystemExit(f'provenance footer anchor drifted: {page.count(old)}')
          path.write_text(page.replace(old, new))
          PY

          node --experimental-strip-types frontend/scripts/food-menu-demand.test.mjs
          python scripts/test_cs1_decision_intelligence.py

      - name: Commit patch and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'bouncampus-merge-bot'
          git config user.email 'noreply@github.com'
          git add frontend/src/app/food-waste/page.tsx
          git rm .github/workflows/cs1-food-provenance-fix.yml
          git diff --cached --check
          git commit -m 'fix(cs1): restore explicit food decision provenance'
          git push origin HEAD:agent/cs1/master-sync
