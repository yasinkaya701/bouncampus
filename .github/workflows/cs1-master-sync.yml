name: CS1 Master Sync

on:
  push:
    branches:
      - agent/cs1/master-sync

permissions:
  contents: write

jobs:
  merge-master:
    if: github.event.head_commit.message == 'chore(cs1): prepare conflict-safe master sync'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/cs1/master-sync
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Merge current master and resolve only expected UI overlaps
        run: |
          set -euo pipefail
          git config user.name 'bouncampus-merge-bot'
          git config user.email 'noreply@github.com'
          git fetch origin master

          set +e
          git merge --no-commit --no-ff origin/master
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          unexpected="$(printf '%s\n' "$conflicts" | grep -Ev '^(frontend/src/app/food-waste/page.tsx|frontend/src/components/shared/Header.tsx)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected conflicts:'
            printf '%s\n' "$unexpected"
            exit 1
          fi

          # Preserve the newer master UX for the two overlapping surfaces, then
          # layer the CS1 decision semantics/navigation back onto that UX.
          git show origin/master:frontend/src/app/food-waste/page.tsx > frontend/src/app/food-waste/page.tsx
          git show origin/master:frontend/src/components/shared/Header.tsx > frontend/src/components/shared/Header.tsx

          python - <<'PY'
          from pathlib import Path

          page_path = Path('frontend/src/app/food-waste/page.tsx')
          page = page_path.read_text()

          old = """  demandContext: {\n    available: boolean;\n    productionBand: ProductionDecisionBand | null;\n    provenance: 'MODEL_ESTIMATE';\n    note: string;\n  };"""
          new = """  demandContext: {\n    available: boolean;\n    actionable: boolean;\n    planningCandidate: {\n      portions: number;\n      baselinePortions: number;\n      lowerBound: number;\n      upperBound: number;\n      signalCoveragePct: number;\n      sourceReadiness: DecisionReadiness;\n      semantics: 'ADVISORY_MODEL_ESTIMATE_NOT_AUTHORIZED_KITCHEN_ORDER';\n    } | null;\n    productionBand: ProductionDecisionBand | null;\n    decisionAssessment: ProductionDecisionBand | null;\n    provenance: 'MODEL_ESTIMATE';\n    note: string;\n  };"""
          if page.count(old) != 1:
              raise SystemExit('FoodApi demandContext anchor drifted')
          page = page.replace(old, new)

          old = """  const band = food?.demandContext.productionBand ?? null;\n  const canApprovePilot = band?.decisionReadiness === 'PILOT_READY';"""
          new = """  const planningCandidate = food?.demandContext.planningCandidate ?? null;\n  const assessmentBand = food?.demandContext.productionBand ?? food?.demandContext.decisionAssessment ?? null;\n  const planningTarget = planningCandidate?.portions ?? assessmentBand?.recommendedTarget ?? null;\n  const band = assessmentBand && planningTarget != null\n    ? { ...assessmentBand, recommendedTarget: planningTarget }\n    : null;\n  const advisoryOnly = Boolean(planningCandidate) && !Boolean(food?.demandContext.actionable);\n  const canApprovePilot = Boolean(food?.demandContext.actionable) && band?.decisionReadiness === 'PILOT_READY';"""
          if page.count(old) != 1:
              raise SystemExit('food band anchor drifted')
          page = page.replace(old, new)

          old = "label={t('Önerilen', 'Recommended')}"
          new = "label={advisoryOnly ? t('Planlama adayı', 'Planning candidate') : t('Önerilen', 'Recommended')}"
          if page.count(old) != 1:
              raise SystemExit('food metric label anchor drifted')
          page = page.replace(old, new)

          old = "footer={band ? t('MODEL_ESTIMATE · ölçüm değil', 'MODEL_ESTIMATE · not measured') : t('Karar bağlamı bekleniyor', 'Waiting for decision context')}"
          new = "footer={band ? (advisoryOnly ? t('ADVISORY · mutfak emri değil', 'ADVISORY · not a kitchen order') : t('MODEL_ESTIMATE · ölçüm değil', 'MODEL_ESTIMATE · not measured')) : t('Karar bağlamı bekleniyor', 'Waiting for decision context')}"
          if page.count(old) != 1:
              raise SystemExit('food metric footer anchor drifted')
          page = page.replace(old, new)

          old = "{t('Üretim önerisi', 'Production recommendation')}"
          new = "{advisoryOnly ? t('Planlama adayı', 'Planning candidate') : t('Üretim önerisi', 'Production recommendation')}"
          if page.count(old) != 1:
              raise SystemExit('food recommendation heading anchor drifted')
          page = page.replace(old, new)
          page_path.write_text(page)

          header_path = Path('frontend/src/components/shared/Header.tsx')
          header = header_path.read_text()
          anchor = "  { href: '/', tr: 'Genel bakış', en: 'Overview' },\n"
          insert = anchor + "  { href: '/campus-ops', tr: 'Operasyon', en: 'Operations' },\n  { href: '/campus-ops/shuttle-frequency', tr: 'Mekik planı', en: 'Shuttle plan' },\n"
          if header.count(anchor) != 1:
              raise SystemExit('header primary nav anchor drifted')
          header = header.replace(anchor, insert)

          locale_anchor = "function LocaleButton({ value, current, onClick }: { value: Locale; current: Locale; onClick: () => void }) {"
          helper = """function isNavActive(pathname: string, href: string) {\n  if (href === '/') return pathname === '/';\n  if (href === '/campus-ops') return pathname === '/campus-ops';\n  return pathname === href || pathname.startsWith(`${href}/`);\n}\n\n""" + locale_anchor
          if header.count(locale_anchor) != 1:
              raise SystemExit('header locale anchor drifted')
          header = header.replace(locale_anchor, helper)

          active = "const active = pathname === link.href || (link.href !== '/' && pathname.startsWith(link.href));"
          if header.count(active) != 2:
              raise SystemExit(f'header active anchors drifted: {header.count(active)}')
          header = header.replace(active, "const active = isNavActive(pathname, link.href);")
          header_path.write_text(header)
          PY

          git add frontend/src/app/food-waste/page.tsx frontend/src/components/shared/Header.tsx
          git rm .github/workflows/cs1-master-sync.yml

          remaining="$(git diff --name-only --diff-filter=U)"
          if [ -n "$remaining" ]; then
            echo 'Unresolved conflicts remain:'
            printf '%s\n' "$remaining"
            exit 1
          fi

          git diff --cached --check
          git commit -m 'Merge master into CS1 role integration line' -m 'Preserve the latest master food-waste UX and shared header while retaining CS1 advisory planning-candidate semantics and campus-operations navigation.'
          git push origin HEAD:agent/cs1/master-sync
