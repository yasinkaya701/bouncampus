name: CS1 Regression Gate

on:
  pull_request:
  push:
    branches:
      - master
      - 'role/**'
      - 'agent/quality-release/**'

permissions:
  contents: read

concurrency:
  group: cs1-regressions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cs1-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q backend/app scripts
      - name: List CS1 regression suites
        run: python scripts/run_cs1_regressions.py --list
      - name: Execute all CS1 regression suites
        run: python scripts/run_cs1_regressions.py
