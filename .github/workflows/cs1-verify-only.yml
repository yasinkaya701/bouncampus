name: CS1 Verify Only

on:
  push:
    branches:
      - agent/cs1/campus-ops-verify-only

permissions:
  contents: read

jobs:
  backend-all-cs1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check fastapi
      - name: Run every CS1 regression script
        run: |
          set -euo pipefail
          for test_file in scripts/test_cs1_*.py; do
            echo "=== $test_file ==="
            python "$test_file"
          done
          python scripts/test_food_decision_policy.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:campus-operations
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q backend/app scripts
      - run: python scripts/agent_fabric_check.py
      - run: python scripts/kreate_check.py
