name: CS1 Current Integrated Head Verify

on:
  push:
    branches:
      - agent/cs1/campus-ops-suite

permissions:
  contents: read

jobs:
  backend-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app scripts
      - name: Run CS1 regressions
        run: |
          set -euo pipefail
          for test_file in scripts/test_cs1_*.py; do
            echo "==> $test_file"
            python "$test_file"
          done
          if [ -f scripts/test_food_decision_policy.py ]; then
            python scripts/test_food_decision_policy.py
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:campus-operations
      - name: Shuttle frequency regression
        run: node --experimental-strip-types scripts/shuttle-frequency.test.mjs
      - name: Food menu regression
        run: node --experimental-strip-types scripts/food-menu-demand.test.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/agent_fabric_check.py
      - run: python scripts/kreate_check.py
      - run: python scripts/verify_feature_preservation.py
