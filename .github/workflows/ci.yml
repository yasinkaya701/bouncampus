name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: [self-hosted, macOS, ARM64, bouncampus]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  repository-data:
    runs-on: [self-hosted, macOS, ARM64, bouncampus]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile backend Python
        run: python -m compileall -q backend/app
      - name: Validate critical JSON datasets
        run: |
          python -m json.tool backend/app/data/campus_config.json >/dev/null
          python -m json.tool frontend/src/data/campus_config.json >/dev/null
          python -m json.tool frontend/src/data/real_boun_courses.json >/dev/null
