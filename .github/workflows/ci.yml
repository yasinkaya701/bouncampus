name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - 'work/**'
      - 'role/**'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  merge-discipline:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, macOS, ARM64, bouncampus]
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate parent/child PR topology and integration slot
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          read -r max_parent_prs max_ready_prs <<EOF
          $(python - <<'PY'
          import json
          cfg = json.load(open('.agents/fabric.json'))
          integration = cfg['integration']
          print(integration['max_parent_pull_requests'], integration['max_integration_ready_pull_requests'])
          PY
          )
          EOF

          is_parent_branch() {
            [[ "$1" =~ ^work/(ie|ee|cs1|cs2)/[a-z0-9][a-z0-9-]*$ ]]
          }

          is_legacy_role_branch() {
            [[ "$1" =~ ^role/(ie|ee|cs1|cs2)- ]]
          }

          if [ "$BASE_REF" = "master" ]; then
            if is_parent_branch "$HEAD_REF"; then
              if ! printf '%s' "$PR_BODY" | grep -Eq 'Parent workstream:[[:space:]]*HUMAN-(IE|EE|CS1|CS2)'; then
                echo "Parent-to-master PR body must declare: Parent workstream: HUMAN-<ROLE>."
                exit 1
              fi
            elif [[ "$HEAD_REF" == agent/quality-release/* ]]; then
              echo "Governance/bootstrap PR directly to master."
            elif is_legacy_role_branch "$HEAD_REF"; then
              echo "Legacy role branch accepted during Fabric v2 migration."
            else
              echo "PRs to master must come from work/<role>/<slug>, legacy role/<role>-*, or agent/quality-release/*."
              exit 1
            fi

            open_count="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base master --limit 100 --json number --jq 'length')"
            ready_count="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base master --limit 100 --json isDraft --jq '[.[] | select(.isDraft == false)] | length')"
            if [ "$open_count" -gt "$max_parent_prs" ]; then
              echo "Too many open parent/master PRs: $open_count > $max_parent_prs."
              exit 1
            fi
            if [ "$ready_count" -gt "$max_ready_prs" ]; then
              echo "Master integration slot violation: $ready_count non-draft PRs > $max_ready_prs."
              exit 1
            fi
          elif is_parent_branch "$BASE_REF"; then
            if [[ "$HEAD_REF" != agent/* ]]; then
              echo "Child PRs into a parent workstream must use agent/<lane>/<task> heads."
              exit 1
            fi
            if ! printf '%s' "$PR_BODY" | grep -Eq 'Agent task ID:[[:space:]]*TASK-[A-Z0-9-]+'; then
              echo "Child PR body must declare: Agent task ID: TASK-...."
              exit 1
            fi
          elif is_legacy_role_branch "$BASE_REF"; then
            if [[ "$HEAD_REF" != agent/* ]]; then
              echo "Legacy feature PRs into role branches must use agent/<lane>/<task> heads."
              exit 1
            fi
          else
            echo "Unsupported PR base: $BASE_REF. Use a parent work branch or master."
            exit 1
          fi

      - name: Require latest target base for merge-ready PRs
        env:
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$IS_DRAFT" = "true" ]; then
            echo "Draft PR: CI is advisory. Latest target base will be required when the PR acquires an integration slot."
            exit 0
          fi
          git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD || {
            echo "Merge-ready PR head is stale. Integrate the latest target branch and rerun exact-head CI."
            exit 1
          }

      - name: Preserve registered features
        run: python scripts/verify_feature_preservation.py --base-ref "${{ github.event.pull_request.base.sha }}"

      - name: Validate autonomous agent fabric
        run: python scripts/agent_fabric_check.py

      - name: Validate merge-before-exit gate
        run: python -m py_compile scripts/agent_exit_gate.py

  master-merge-audit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, macOS, ARM64, bouncampus]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require merged-PR provenance and normal merge commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git rev-parse HEAD^ >/dev/null 2>&1 || ! git cat-file -e HEAD^:.github/merge-enforcement-v2-enabled 2>/dev/null; then
            echo "Merge policy bootstrap commit; strict provenance starts with the next master change after v2 marker."
            exit 0
          fi

          merged_count="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "master")] | length')"

          if [ "$merged_count" -lt 1 ]; then
            echo "Direct push to master detected. Changes must merge through a validated PR."
            exit 1
          fi

          parent_count="$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')"
          if [ "$parent_count" -lt 2 ]; then
            echo "Master integration is not a normal merge commit."
            exit 1
          fi

      - name: Verify integrated head is contained in master
        run: |
          branch_head="$(git rev-parse HEAD^2)"
          python scripts/agent_exit_gate.py --branch-head "$branch_head" --master-ref HEAD

  feature-registry:
    runs-on: [self-hosted, macOS, ARM64, bouncampus]
    steps:
      - uses: actions/checkout@v4
      - name: Validate registered feature files
        run: python scripts/verify_feature_preservation.py
      - name: Validate agent fabric policy
        run: python scripts/agent_fabric_check.py
      - name: Compile merge-before-exit gate
        run: python -m py_compile scripts/agent_exit_gate.py

  frontend:
    runs-on: [self-hosted, macOS, ARM64, bouncampus]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  repository-data:
    runs-on: [self-hosted, macOS, ARM64, bouncampus]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/bouncampus-python"
          echo "$RUNNER_TEMP/bouncampus-python/bin" >> "$GITHUB_PATH"
      - name: Compile repository Python
        run: python -m compileall -q backend/app scripts
      - name: Test autonomous agent fabric
        run: python scripts/test_agent_fabric_check.py
      - name: Test autonomous task operations
        run: python scripts/test_agent_task.py
      - name: Validate autonomous agent fabric
        run: python scripts/agent_fabric_check.py
      - name: Validate KREATE operating system
        run: python scripts/kreate_check.py
      - name: Validate critical JSON datasets
        run: |
          python -m json.tool backend/app/data/campus_config.json >/dev/null
          python -m json.tool frontend/src/data/campus_config.json >/dev/null
          python -m json.tool frontend/src/data/real_boun_courses.json >/dev/null
