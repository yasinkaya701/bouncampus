name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-discipline:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, macOS, ARM64, bouncampus]
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Require a single open integration PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number --jq 'length')"
          if [ "$count" -ne 1 ]; then
            echo "BOUNCAMPUS allows exactly one open integration PR; found $count."
            exit 1
          fi

      - name: Require PR head to contain current master
        run: |
          git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD || {
            echo "PR head is stale. Integrate the latest master before merge."
            exit 1
          }

      - name: Preserve registered features
        run: python scripts/verify_feature_preservation.py --base-ref "${{ github.event.pull_request.base.sha }}"

      - name: Validate autonomous agent fabric
        run: python scripts/agent_fabric_check.py

      - name: Validate merge-before-exit gate
        run: python -m py_compile scripts/agent_exit_gate.py

  master-merge-audit:
    if: github.event_name == 'push'
    runs-on: [self-hosted, macOS, ARM64, bouncampus]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require merged-PR provenance and merge commit after bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git rev-parse HEAD^ >/dev/null 2>&1 || ! git cat-file -e HEAD^:.github/merge-enforcement-v2-enabled 2>/dev/null; then
            echo "Merge-before-exit policy bootstrap commit; strict provenance starts with the next master change after v2 marker."
            exit 0
          fi

          merged_count="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "master")] | length')"

          if [ "$merged_count" -lt 1 ]; then
            echo "Direct push to master detected. The owning workstream agent must merge through the single integration PR."
            exit 1
          fi

          parent_count="$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')"
          if [ "$parent_count" -lt 2 ]; then
            echo "Master integration is not a merge commit. BOUNCAMPUS requires a normal merge commit so agent_exit_gate can prove the validated agent head reached master."
            exit 1
          fi

      - name: Verify integrated agent head is contained in master
        run: |
          branch_head="$(git rev-parse HEAD^2)"
          python scripts/agent_exit_gate.py --branch-head "$branch_head" --master-ref HEAD

  feature-registry:
    runs-on: [self-hosted, macOS, ARM64, bouncampus]
    steps:
      - uses: actions/checkout@v4
      - name: Validate registered feature files
        run: python scripts/verify_feature_preservation.py
      - name: Validate agent fabric policy
        run: python scripts/agent_fabric_check.py
      - name: Compile merge-before-exit gate
        run: python -m py_compile scripts/agent_exit_gate.py

  frontend:
    runs-on: [self-hosted, macOS, ARM64, bouncampus]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  repository-data:
    runs-on: [self-hosted, macOS, ARM64, bouncampus]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/bouncampus-python"
          echo "$RUNNER_TEMP/bouncampus-python/bin" >> "$GITHUB_PATH"
      - name: Compile repository Python
        run: python -m compileall -q backend/app scripts
      - name: Test autonomous agent fabric
        run: python scripts/test_agent_fabric_check.py
      - name: Test autonomous task operations
        run: python scripts/test_agent_task.py
      - name: Validate autonomous agent fabric
        run: python scripts/agent_fabric_check.py
      - name: Validate KREATE operating system
        run: python scripts/kreate_check.py
      - name: Validate critical JSON datasets
        run: |
          python -m json.tool backend/app/data/campus_config.json >/dev/null
          python -m json.tool frontend/src/data/campus_config.json >/dev/null
          python -m json.tool frontend/src/data/real_boun_courses.json >/dev/null
