name: CS1 Role Resync

on:
  push:
    branches:
      - agent/cs1/master-sync

permissions:
  contents: write

jobs:
  merge-role:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/cs1/master-sync
      - name: Merge current role head without losing food decision wiring
        run: |
          set -euo pipefail
          git config user.name 'bouncampus-merge-bot'
          git config user.email 'noreply@github.com'
          git fetch origin role/cs1-decision-intelligence

          set +e
          git merge --no-commit --no-ff origin/role/cs1-decision-intelligence
          set -e

          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          unexpected="$(printf '%s\n' "$conflicts" | grep -Ev '^(frontend/scripts/food-menu-demand.test.mjs|frontend/src/app/food-waste/page.tsx|frontend/src/components/shared/Header.tsx|scripts/agent_fabric_check.py|.github/PULL_REQUEST_TEMPLATE.md)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected concurrent-role conflicts:'
            printf '%s\n' "$unexpected"
            exit 1
          fi

          # These files intentionally retain the already verified candidate-side
          # integrations. All non-conflicting concurrent role work is preserved.
          for path in \
            frontend/scripts/food-menu-demand.test.mjs \
            frontend/src/app/food-waste/page.tsx \
            frontend/src/components/shared/Header.tsx; do
            if git diff --name-only --diff-filter=U | grep -Fxq "$path"; then
              git checkout --ours -- "$path"
              git add "$path"
            fi
          done

          # Governance/fabric truth follows the newest role head where conflicts exist.
          for path in scripts/agent_fabric_check.py .github/PULL_REQUEST_TEMPLATE.md; do
            if git diff --name-only --diff-filter=U | grep -Fxq "$path"; then
              git checkout --theirs -- "$path"
              git add "$path"
            fi
          done

          remaining="$(git diff --name-only --diff-filter=U)"
          if [ -n "$remaining" ]; then
            echo 'Unresolved conflicts remain:'
            printf '%s\n' "$remaining"
            exit 1
          fi

          git rm .github/workflows/cs1-role-resync.yml
          git diff --cached --check
          git commit -m 'Merge concurrent CS1 role head into integration candidate'
          git push origin HEAD:agent/cs1/master-sync
