name: CS1 Decision Intelligence Validation

on:
  push:
    branches:
      - agent/api-product/cs1-decision-core

permissions:
  contents: read

concurrency:
  group: cs1-decision-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    runs-on: [self-hosted, macOS, ARM64, bouncampus]
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Focused food decision policy tests
        run: python scripts/test_food_decision_policy.py

      - name: Comprehensive CS1 decision intelligence tests
        run: python scripts/test_cs1_decision_intelligence.py

      - name: KREATE integrity gate
        run: python scripts/kreate_check.py

      - name: Compile Python surfaces
        run: python -m compileall -q backend/app scripts

      - name: Feature preservation gate
        run: python scripts/verify_feature_preservation.py

      - name: Agent fabric gate
        run: python scripts/agent_fabric_check.py

  frontend-validation:
    runs-on: [self-hosted, macOS, ARM64, bouncampus]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
