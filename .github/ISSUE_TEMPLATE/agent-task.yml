name: Autonomous agent task
description: Machine-friendly task intake for parallel BOUNCAMPUS work
title: "[AGENT] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Default execution mode is AUTONOMOUS. Select a human gate only when one of the explicit critical categories applies. Routine engineering uncertainty is not a human gate.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: One concrete outcome this task must produce.
      placeholder: "Implement/verify ..."
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
    validations:
      required: true

  - type: input
    id: lane
    attributes:
      label: Lane
      description: Lowercase execution lane such as frontend-ux, campus-geo, api-product, quality-release.
      placeholder: "quality-release"
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Hard dependencies
      description: Task IDs that must reach MERGED_VERIFIED first, or NONE.
      placeholder: "TASK-... / NONE"
    validations:
      required: true

  - type: textarea
    id: touched_paths
    attributes:
      label: Intended touched paths
      description: Repository path prefixes this task needs to own. Keep narrow enough for parallel execution.
      placeholder: |
        scripts/example.py
        docs/example/
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables
      description: Exact repository artifacts/results expected.
      placeholder: "- ..."
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable criteria an agent can verify without asking a human.
      placeholder: "- [ ] ..."
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation commands
      description: Commands/checks expected before integration.
      placeholder: "python ..."
    validations:
      required: true

  - type: dropdown
    id: human_gate
    attributes:
      label: Human gate
      description: NONE unless a critical gate is genuinely required.
      options:
        - NONE
        - EVIDENCE_ATTESTATION
        - IRREVERSIBLE_ACTION
        - PHYSICAL_SAFETY
        - EXTERNAL_COMMITMENT
        - PRODUCT_DIRECTION
    validations:
      required: true

  - type: textarea
    id: human_question
    attributes:
      label: Human decision question, only if gated
      description: Leave as NONE when Human gate is NONE. Otherwise ask one concrete decision only.
      placeholder: "NONE"
    validations:
      required: true

  - type: textarea
    id: failure
    attributes:
      label: Failure / stop condition
      description: What evidence means the task should be blocked, modified, or cancelled rather than papered over?
      placeholder: "- ..."
    validations:
      required: true
