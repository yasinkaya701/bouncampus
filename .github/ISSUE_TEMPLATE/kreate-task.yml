name: KREATE task
description: Evidence-gated KREATE application/PMR work item
title: "[KREATE] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use this form for KREATE work. Do not mark a task DONE until the artifact, evidence, limitations, acceptance criteria, and required human review are present.

  - type: textarea
    id: why
    attributes:
      label: WHY this improves top-15 probability
      description: Name the rubric gap, evidence gap, major risk, or real decision this work improves.
      placeholder: "TODO — specific reason, not generic progress."
    validations:
      required: true

  - type: input
    id: owner
    attributes:
      label: Owner
      placeholder: "IE / EE / CS1 / CS2 / named teammate"
    validations:
      required: true

  - type: dropdown
    id: workstream
    attributes:
      label: Role / workstream
      options:
        - IE — Customer Discovery & Market
        - EE — Physical Systems & Measurement
        - CS1 — Decision Intelligence
        - CS2 — Product Strategy & Application
        - Shared / cross-functional
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
    validations:
      required: true

  - type: textarea
    id: dependency
    attributes:
      label: Dependency
      description: Person, access, data, interview, or prior artifact needed. Use NONE if truly independent.
      placeholder: "TODO"
    validations:
      required: true

  - type: textarea
    id: deliverable
    attributes:
      label: Deliverable
      description: Exact artifact that will exist when the task is complete.
      placeholder: "TODO"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable checks that must pass.
      placeholder: "- [ ] TODO"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence required
      description: Evidence IDs expected, or the explicit hypothesis/unknown this task will test. Never pre-create fake interview evidence.
      placeholder: "E-... / H-... / UNKNOWN"
    validations:
      required: true

  - type: textarea
    id: kill
    attributes:
      label: Failure / kill condition
      description: What result or blocker means the team should stop, modify, or reject this work?
      placeholder: "TODO"
    validations:
      required: true

  - type: input
    id: deadline
    attributes:
      label: Deadline
      placeholder: "YYYY-MM-DD HH:MM"
    validations:
      required: true
